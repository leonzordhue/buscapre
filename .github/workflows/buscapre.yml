# Buscapre na nuvem: OLX (Manaus) a cada ~15 min, aviso no Discord. Facebook fica no PC (servidor cai no login).
name: buscapre
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
concurrency: buscapre
permissions:
  contents: write
jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright truststore && python -m playwright install --with-deps chrome
      - name: config (webhook vem do segredo DISCORD_WEBHOOK)
        env: {WH: "${{ secrets.DISCORD_WEBHOOK }}"}
        run: |
          python - <<'PY'
          import json, os
          json.dump({"discord_webhook": os.environ["WH"], "telegram_chat_id": "discord", "pular_sites": ["Facebook"],
                     "local_contem": "Manaus", "olx_caminho": "games/consoles-de-video-game/estado-am/regiao-de-manaus",
                     "fb_cidade": "manaus"}, open("config.json", "w"))
          PY
      - run: xvfb-run -a python monitor.py
        env: {MONITOR_DADOS: estado}
      - name: salva estado
        run: |
          git config user.name buscapre-bot && git config user.email buscapre-bot@users.noreply.github.com
          git add estado/vistos.json estado/anuncios.json
          git diff --cached --quiet || (git commit -qm "estado $(date -u +%FT%H:%M)" && (git push || (git pull --rebase && git push)))
